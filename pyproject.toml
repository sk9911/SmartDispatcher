[project]
name = "regret"
version = "0.1.0"
description = "Forecast regret POC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gcsfs>=2026.8.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "numpy>=2.5.3",
    "openap>=2.6.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "scipy>=1.18.1",
    "xarray>=2026.9.0",
    "zarr>=3.4.0",
]

[project.scripts]
regret = "regret.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regret"]

[tool.pytest.ini_options]
testpaths = ["tests", "notebooks"]
addopts = "--nbmake"
